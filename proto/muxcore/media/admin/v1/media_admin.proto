syntax = "proto3";

package muxcore.media.admin.v1;

option go_package = "github.com/Muxcore-Media/contracts-media-admin/gen/muxcore/media/admin/v1;mediaadminv1";

// MediaAdminService is implemented by media library modules (movies, TV, books,
// etc.) to provide browsing, search, metadata editing, and artwork management
// to the admin UI. Core never imports this proto — it is a domain contract
// between media modules and the admin UI.
service MediaAdminService {
  // GetMediaTypeInfo returns metadata about this media type for the admin UI
  // nav tab: display name, icon, available filter/search fields.
  rpc GetMediaTypeInfo(GetMediaTypeInfoRequest) returns (GetMediaTypeInfoResponse);

  // ListItems returns a paginated, searchable list of media items.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);

  // GetItem returns a single media item with full detail.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);

  // ListChildren returns child items for a parent (seasons/episodes, albums/tracks).
  rpc ListChildren(ListChildrenRequest) returns (ListChildrenResponse);

  // GetChild returns one child item under a parent.
  rpc GetChild(GetChildRequest) returns (GetChildResponse);

  // UpdateMetadata edits metadata fields on a media item.
  rpc UpdateMetadata(UpdateMetadataRequest) returns (UpdateMetadataResponse);

  // SetMonitored toggles monitor state on an item or child (season/episode/album/track).
  rpc SetMonitored(SetMonitoredRequest) returns (SetMonitoredResponse);

  // ListArtwork returns artwork variants for a media item.
  rpc ListArtwork(ListArtworkRequest) returns (ListArtworkResponse);

  // ListRemoteArtwork returns remote artwork candidates from the metadata provider.
  rpc ListRemoteArtwork(ListRemoteArtworkRequest) returns (ListRemoteArtworkResponse);

  // ReplaceArtwork uploads or replaces an artwork image for a media item.
  rpc ReplaceArtwork(stream ReplaceArtworkRequest) returns (ReplaceArtworkResponse);

  // DeleteArtwork removes one artwork variant from a media item.
  rpc DeleteArtwork(DeleteArtworkRequest) returns (DeleteArtworkResponse);

  // DeleteItem removes a media item and its associated data from the library.
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);

  // RefreshItem triggers a metadata refresh for a media item from its
  // original source (e.g. re-fetch from TMDB).
  rpc RefreshItem(RefreshItemRequest) returns (RefreshItemResponse);

  // SearchIndexers searches configured indexers for sources matching the
  // given media item and returns available downloads.
  rpc SearchIndexers(SearchIndexersRequest) returns (SearchIndexersResponse);

  // GrabRelease queues a download for an indexer result by opaque guid.
  // Implementers resolve guid via automation/fixtures; callers must not pass raw URLs.
  rpc GrabRelease(GrabReleaseRequest) returns (GrabReleaseResponse);

  // ListFiles returns on-disk files linked to a media item.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

  // RemoveFile unlinks a file from a media item.
  rpc RemoveFile(RemoveFileRequest) returns (RemoveFileResponse);

  // ListHistory returns grab/import/delete activity for this library.
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);

  // ListMissing returns monitored items that lack a file.
  rpc ListMissing(ListMissingRequest) returns (ListMissingResponse);

  // Tag management.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
  rpc SetItemTags(SetItemTagsRequest) returns (SetItemTagsResponse);

  // Collections (movies). TV returns Unimplemented.
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc GetCollectionItems(GetCollectionItemsRequest) returns (GetCollectionItemsResponse);
  rpc SyncCollection(SyncCollectionRequest) returns (SyncCollectionResponse);
  rpc SetCollectionMonitored(SetCollectionMonitoredRequest) returns (SetCollectionMonitoredResponse);

  // Calendar (TV). Movies returns Unimplemented.
  rpc GetCalendar(GetCalendarRequest) returns (GetCalendarResponse);
}

// --- Enums ---

enum Feature {
  FEATURE_UNSPECIFIED = 0;
  FEATURE_MISSING = 1;
  FEATURE_TAGS = 2;
  FEATURE_COLLECTIONS = 3;
  FEATURE_CALENDAR = 4;
}

enum HistoryEventType {
  HISTORY_EVENT_TYPE_UNSPECIFIED = 0;
  HISTORY_EVENT_TYPE_GRAB = 1;
  HISTORY_EVENT_TYPE_IMPORT = 2;
  HISTORY_EVENT_TYPE_DELETE_ITEM = 3;
  HISTORY_EVENT_TYPE_DELETE_FILE = 4;
}

enum SortField {
  SORT_FIELD_UNSPECIFIED = 0;
  SORT_FIELD_TITLE = 1;
  SORT_FIELD_YEAR = 2;
  SORT_FIELD_CREATED_AT = 3;
  SORT_FIELD_UPDATED_AT = 4;
  SORT_FIELD_RUNTIME = 5;
  SORT_FIELD_RATING = 6;
}

enum ArtworkType {
  ARTWORK_TYPE_UNSPECIFIED = 0;
  ARTWORK_TYPE_POSTER = 1;
  ARTWORK_TYPE_BACKGROUND = 2;
  ARTWORK_TYPE_LOGO = 3;
  ARTWORK_TYPE_BANNER = 4;
  ARTWORK_TYPE_THUMB = 5;
  ARTWORK_TYPE_STILL = 6;
}

enum FilterFieldType {
  FILTER_FIELD_TYPE_UNSPECIFIED = 0;
  FILTER_FIELD_TYPE_TEXT = 1;
  FILTER_FIELD_TYPE_NUMBER = 2;
  FILTER_FIELD_TYPE_SELECT = 3;
  FILTER_FIELD_TYPE_DATE = 4;
}

// --- Item Management ---

message DeleteItemRequest {
  string id = 1;
  bool delete_files = 2;
}

message DeleteItemResponse {}

message RefreshItemRequest {
  string id = 1;
}

message RefreshItemResponse {
  MediaItem item = 1;
}

message SearchIndexersRequest {
  string item_id = 1;
  int32 limit = 2;
  // Optional TV episode targeting when item_id is a series.
  int32 season = 3;
  int32 episode = 4;
}

message IndexerResult {
  string title = 1;
  string guid = 2;
  string indexer = 3;
  int64 size = 4;
  string quality = 5;
  int32 seeders = 6;
  // Deprecated: admin grab path uses guid + GrabRelease. May be empty.
  string download_url = 7;
  bool approved = 8;
  string protocol = 9;
  repeated string reject_reasons = 10;
  int32 score = 11;
}

message SearchIndexersResponse {
  repeated IndexerResult results = 1;
  int32 total = 2;
}

message GrabReleaseRequest {
  string item_id = 1;
  string guid = 2;
}

message GrabReleaseResponse {
  string download_id = 1;
}

message ListFilesRequest {
  string item_id = 1;
}

message MediaFile {
  string id = 1;
  string item_id = 2;
  string file_path = 3;
  string quality = 4;
  int64 size_bytes = 5;
  string container = 6;
  string created_at = 7;
}

message ListFilesResponse {
  repeated MediaFile files = 1;
}

message RemoveFileRequest {
  string item_id = 1;
  string file_id = 2;
  bool delete_disk = 3;
}

message RemoveFileResponse {}

message SetMonitoredRequest {
  string item_id = 1;
  // Optional child id (season, episode, album, track). Empty applies to item_id.
  string child_id = 2;
  bool monitored = 3;
}

message SetMonitoredResponse {
  MediaItem item = 1;
}

// --- Media Types ---

message GetMediaTypeInfoRequest {}

message GetMediaTypeInfoResponse {
  string display_name = 1;  // "Movies", "TV Shows", "Books", etc.
  string icon = 2;          // CSS class or emoji for the nav tab
  repeated FilterField filter_fields = 3;
  repeated Feature features = 4;
}

message FilterField {
  string key = 1;          // field name in MediaItem.metadata or first-class field
  string label = 2;        // display label
  FilterFieldType type = 3;
  repeated string options = 4;  // for FILTER_FIELD_TYPE_SELECT
}

// --- Items ---

message ListItemsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  map<string, string> filters = 4; // per-type filter fields
  SortField sort_by = 5;
  string sort_order = 6;  // "asc" or "desc"
  string tag_id = 7;
}

message ListItemsResponse {
  repeated MediaItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetItemRequest {
  string id = 1;
}

message GetItemResponse {
  MediaItem item = 1;
}

message ListChildrenRequest {
  string parent_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListChildrenResponse {
  repeated MediaItem children = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetChildRequest {
  string parent_id = 1;
  string child_id = 2;
}

message GetChildResponse {
  MediaItem child = 1;
}

message MediaItem {
  string id = 1;
  string title = 2;
  string description = 3;
  int64 year = 4;
  repeated string genres = 5;
  // Type-specific fields not promoted to first-class columns.
  // Movies: runtime (minutes).
  // Music: musicbrainz_id.
  // TV: season_number, episode_number, air_date (YYYY-MM-DD).
  // Implementers may still mirror first-class fields here during migration.
  map<string, string> metadata = 6;
  repeated ArtworkInfo artwork = 7;
  string created_at = 8;
  string updated_at = 9;
  bool monitored = 10;
  bool has_file = 11;
  string quality_profile_id = 12;
  string root_folder_path = 13;
  int32 tmdb_id = 14;
}

// --- Metadata ---

message UpdateMetadataRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  int64 year = 4;
  repeated string genres = 5;
  map<string, string> metadata = 6;
  optional bool monitored = 7;
  optional string quality_profile_id = 8;
  optional string root_folder_path = 9;
  optional int32 tmdb_id = 10;
}

message UpdateMetadataResponse {
  MediaItem item = 1;
}

// --- Artwork ---

message ListArtworkRequest {
  string id = 1;
}

message ListArtworkResponse {
  repeated ArtworkInfo artwork = 1;
}

message ListRemoteArtworkRequest {
  string item_id = 1;
  ArtworkType artwork_type = 2;
}

message RemoteArtworkInfo {
  string url = 1;
  ArtworkType type = 2;
  int32 width = 3;
  int32 height = 4;
  string source = 5;
}

message ListRemoteArtworkResponse {
  repeated RemoteArtworkInfo artwork = 1;
}

message ArtworkInfo {
  string id = 1;
  string item_id = 2;
  ArtworkType type = 3;
  string url = 4;        // HTTP URL served by the media module
  int32 width = 5;
  int32 height = 6;
  string mime_type = 7;
}

message ReplaceArtworkRequest {
  oneof data {
    string item_id = 1;
    ArtworkType artwork_type = 2;
    string filename = 3;
    bytes chunk = 4;
  }
}

message ReplaceArtworkResponse {
  ArtworkInfo artwork = 1;
}

message DeleteArtworkRequest {
  string item_id = 1;
  string artwork_id = 2;
}

message DeleteArtworkResponse {}

// --- History / Activity ---

message ListHistoryRequest {
  int32 page = 1;
  int32 page_size = 2;
  string item_id = 3;      // optional per-title filter
  HistoryEventType event_type = 4;
}

message HistoryRecord {
  string id = 1;
  HistoryEventType event_type = 2;
  string item_id = 3;
  string title = 4;
  string source_title = 5;
  string quality = 6;
  string indexer = 7;
  string file_path = 8;
  string download_id = 9;
  string created_at = 10;
}

message ListHistoryResponse {
  repeated HistoryRecord records = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// --- Missing ---

message ListMissingRequest {
  int32 page = 1;
  int32 page_size = 2;
  string parent_id = 3; // optional: series_id for TV
}

message MissingItem {
  string id = 1;          // movie_id or episode_id
  string parent_id = 2;   // movie_id (movies) or series_id (TV)
  string title = 3;
  int32 year = 4;
  map<string, string> metadata = 5;
}

message ListMissingResponse {
  repeated MissingItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// --- Tags ---

message ListTagsRequest {}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message Tag {
  string id = 1;
  string label = 2;
  string created_at = 3;
}

message CreateTagRequest {
  string label = 1;
}

message CreateTagResponse {
  string tag_id = 1;
}

message DeleteTagRequest {
  string tag_id = 1;
}

message DeleteTagResponse {}

message SetItemTagsRequest {
  string item_id = 1;
  repeated string tag_ids = 2;
}

message SetItemTagsResponse {}

// --- Collections ---

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated CollectionSummary collections = 1;
}

message CollectionSummary {
  string id = 1;
  string name = 2;
  int32 item_count = 3;
}

message GetCollectionItemsRequest {
  string collection_id = 1;
}

message GetCollectionItemsResponse {
  string collection_id = 1;
  string name = 2;
  repeated MediaItem items = 3;
}

message SyncCollectionRequest {
  string collection_id = 1;
  bool add_missing = 2;
}

message SyncCollectionResponse {
  int32 added = 1;
  int32 already_present = 2;
  int32 missing_on_source = 3;
}

message SetCollectionMonitoredRequest {
  string collection_id = 1;
  bool monitored = 2;
  bool search_on_add = 3;
  string quality_profile_id = 4;
  string root_folder_path = 5;
}

message SetCollectionMonitoredResponse {}

// --- Calendar ---

message GetCalendarRequest {
  string start_date = 1; // YYYY-MM-DD
  string end_date = 2;   // YYYY-MM-DD
  bool include_unmonitored = 3;
}

message GetCalendarResponse {
  repeated CalendarItem items = 1;
}

message CalendarItem {
  string id = 1;          // episode_id
  string parent_id = 2;   // series_id
  string title = 3;       // series name
  string subtitle = 4;    // episode name
  string date = 5;        // air_date YYYY-MM-DD
  bool monitored = 6;
  bool has_file = 7;
  map<string, string> metadata = 8;
}
