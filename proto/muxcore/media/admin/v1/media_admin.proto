syntax = "proto3";

package muxcore.media.admin.v1;

option go_package = "github.com/Muxcore-Media/contracts-media-admin/gen/muxcore/media/admin/v1;mediaadminv1";

// MediaAdminService is implemented by media library modules (movies, TV, books,
// etc.) to provide browsing, search, metadata editing, and artwork management
// to the admin UI. Core never imports this proto — it is a domain contract
// between media modules and the admin UI.
service MediaAdminService {
  // GetMediaTypeInfo returns metadata about this media type for the admin UI
  // nav tab: display name, icon, available filter/search fields.
  rpc GetMediaTypeInfo(GetMediaTypeInfoRequest) returns (GetMediaTypeInfoResponse);

  // ListItems returns a paginated, searchable list of media items.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);

  // GetItem returns a single media item with full detail.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);

  // UpdateMetadata edits metadata fields on a media item.
  rpc UpdateMetadata(UpdateMetadataRequest) returns (UpdateMetadataResponse);

  // ListArtwork returns artwork variants for a media item.
  rpc ListArtwork(ListArtworkRequest) returns (ListArtworkResponse);

  // ReplaceArtwork uploads or replaces an artwork image for a media item.
  rpc ReplaceArtwork(stream ReplaceArtworkRequest) returns (ReplaceArtworkResponse);

  // DeleteItem removes a media item and its associated data from the library.
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);

  // RefreshItem triggers a metadata refresh for a media item from its
  // original source (e.g. re-fetch from TMDB).
  rpc RefreshItem(RefreshItemRequest) returns (RefreshItemResponse);

  // SearchIndexers searches configured indexers for sources matching the
  // given media item and returns available downloads.
  rpc SearchIndexers(SearchIndexersRequest) returns (SearchIndexersResponse);

  // ListHistory returns grab/import/delete activity for this library.
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);

  // ListMissing returns monitored items that lack a file.
  rpc ListMissing(ListMissingRequest) returns (ListMissingResponse);

  // Tag management.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
  rpc SetItemTags(SetItemTagsRequest) returns (SetItemTagsResponse);

  // Collections (movies). TV returns Unimplemented.
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc GetCollectionItems(GetCollectionItemsRequest) returns (GetCollectionItemsResponse);

  // Calendar (TV). Movies returns Unimplemented.
  rpc GetCalendar(GetCalendarRequest) returns (GetCalendarResponse);
}

// --- Item Management ---

message DeleteItemRequest {
  string id = 1;
  bool delete_files = 2;
}

message DeleteItemResponse {}

message RefreshItemRequest {
  string id = 1;
}

message RefreshItemResponse {
  MediaItem item = 1;
}

message SearchIndexersRequest {
  string item_id = 1;
  int32 limit = 2;
}

message IndexerResult {
  string title = 1;
  string guid = 2;
  string indexer = 3;
  int64 size = 4;
  string quality = 5;
  int32 seeders = 6;
  string download_url = 7;
  bool approved = 8;
}

message SearchIndexersResponse {
  repeated IndexerResult results = 1;
  int32 total = 2;
}

// --- Media Types ---

message GetMediaTypeInfoRequest {}

message GetMediaTypeInfoResponse {
  string display_name = 1;  // "Movies", "TV Shows", "Books", etc.
  string icon = 2;          // CSS class or emoji for the nav tab
  repeated FilterField filter_fields = 3;
  // Feature flags for admin UI tabs: "missing", "tags", "collections", "calendar"
  repeated string features = 4;
}

message FilterField {
  string key = 1;          // field name in MediaItem.metadata
  string label = 2;        // display label
  string type = 3;         // "text", "number", "select", "date"
  repeated string options = 4;  // for "select" type
}

// --- Items ---

message ListItemsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  map<string, string> filters = 4; // per-type filter fields
  string sort_by = 5;
  string sort_order = 6;  // "asc" or "desc"
  string tag_id = 7;
}

message ListItemsResponse {
  repeated MediaItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetItemRequest {
  string id = 1;
}

message GetItemResponse {
  MediaItem item = 1;
}

message MediaItem {
  string id = 1;
  string title = 2;
  string description = 3;
  int64 year = 4;
  repeated string genres = 5;
  map<string, string> metadata = 6;  // type-specific fields (the Meta pattern)
  repeated ArtworkInfo artwork = 7;
  string created_at = 8;
  string updated_at = 9;
}

// --- Metadata ---

message UpdateMetadataRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  int64 year = 4;
  repeated string genres = 5;
  map<string, string> metadata = 6;
}

message UpdateMetadataResponse {
  MediaItem item = 1;
}

// --- Artwork ---

message ListArtworkRequest {
  string id = 1;
}

message ListArtworkResponse {
  repeated ArtworkInfo artwork = 1;
}

message ArtworkInfo {
  string id = 1;
  string item_id = 2;
  string type = 3;      // "poster", "background", "logo", etc.
  string url = 4;        // HTTP URL served by the media module
  int32 width = 5;
  int32 height = 6;
  string mime_type = 7;
}

message ReplaceArtworkRequest {
  oneof data {
    string item_id = 1;
    string artwork_type = 2;  // "poster", "background", etc.
    string filename = 3;
    bytes chunk = 4;
  }
}

message ReplaceArtworkResponse {
  ArtworkInfo artwork = 1;
}

// --- History / Activity ---

message ListHistoryRequest {
  int32 page = 1;
  int32 page_size = 2;
  string item_id = 3;      // optional per-title filter
  string event_type = 4;   // optional: grab|import|delete_item|delete_file
}

message HistoryRecord {
  string id = 1;
  string event_type = 2;
  string item_id = 3;
  string title = 4;
  string source_title = 5;
  string quality = 6;
  string indexer = 7;
  string file_path = 8;
  string download_id = 9;
  string created_at = 10;
}

message ListHistoryResponse {
  repeated HistoryRecord records = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// --- Missing ---

message ListMissingRequest {
  int32 page = 1;
  int32 page_size = 2;
  string parent_id = 3; // optional: series_id for TV
}

message MissingItem {
  string id = 1;          // movie_id or episode_id
  string parent_id = 2;   // movie_id (movies) or series_id (TV)
  string title = 3;
  int32 year = 4;
  map<string, string> metadata = 5;
}

message ListMissingResponse {
  repeated MissingItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// --- Tags ---

message ListTagsRequest {}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message Tag {
  string id = 1;
  string label = 2;
  string created_at = 3;
}

message CreateTagRequest {
  string label = 1;
}

message CreateTagResponse {
  string tag_id = 1;
}

message DeleteTagRequest {
  string tag_id = 1;
}

message DeleteTagResponse {}

message SetItemTagsRequest {
  string item_id = 1;
  repeated string tag_ids = 2;
}

message SetItemTagsResponse {}

// --- Collections ---

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated CollectionSummary collections = 1;
}

message CollectionSummary {
  string id = 1;
  string name = 2;
  int32 item_count = 3;
}

message GetCollectionItemsRequest {
  string collection_id = 1;
}

message GetCollectionItemsResponse {
  string collection_id = 1;
  string name = 2;
  repeated MediaItem items = 3;
}

// --- Calendar ---

message GetCalendarRequest {
  string start_date = 1; // YYYY-MM-DD
  string end_date = 2;   // YYYY-MM-DD
  bool include_unmonitored = 3;
}

message GetCalendarResponse {
  repeated CalendarItem items = 1;
}

message CalendarItem {
  string id = 1;          // episode_id
  string parent_id = 2;   // series_id
  string title = 3;       // series name
  string subtitle = 4;    // episode name
  string date = 5;        // air_date YYYY-MM-DD
  bool monitored = 6;
  bool has_file = 7;
  map<string, string> metadata = 8;
}
